[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "pptx-pdf"
version = "0.2.1"
description = "Convert PowerPoint decks to PDF with LibreOffice's renderer, no LibreOffice install"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Office/Business",
]

[project.urls]
Repository = "https://github.com/dsaad68/pptx-pdf"

[tool.maturin]
module-name = "pptx_pdf._native"
python-source = "python"
manifest-path = "Cargo.toml"
features = ["pyo3/extension-module"]
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
