[package]
name = "lo-runtime"
version = "0.2.2"
description = "Locates or unpacks the bundled LibreOffice runtime tree and prepares a user profile"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[features]
# Embed a stripped LibreOffice tree (tar.zst at $PPTX_PDF_LO_TREE, set at build time)
# and unpack it to the user's cache directory on first run.
embedded = ["dep:tar", "dep:zstd"]
# Fetch the tree over HTTPS on first run instead (a ~3 MB binary); verified against a
# SHA-256 pinned at build time or the release's SHA256SUMS.
download = ["dep:tar", "dep:zstd", "dep:ureq", "dep:sha2"]

[dependencies]
sha2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ureq = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }

[build-dependencies]
sha2 = { workspace = true }

[lints]
workspace = true
