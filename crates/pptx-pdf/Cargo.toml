[package]
name = "pptx-pdf"
version = "1.0.0"
description = "Convert PowerPoint decks to PDF with an embedded LibreOffice, no install required"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pptx-pdf"
path = "src/main.rs"

[features]
# `cargo install pptx-pdf` gives the slim binary that downloads its LibreOffice tree on first use.
default = ["download"]
# Carry the stripped LibreOffice tree inside the binary (see lo-runtime); takes precedence
# over `download` at run time.
embedded = ["lo-runtime/embedded"]
download = ["lo-runtime/download", "dep:indicatif"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
indicatif = { workspace = true, optional = true }
lo-runtime = { workspace = true }
lok = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true

# `cargo binstall pptx-pdf` fetches the prebuilt self-contained binary from GitHub releases
# (published by tools/release.sh / .github/workflows/release.yml) instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"
