# On a v* tag: build the LibreOffice trees and the self-contained binaries for every platform,
# run the end-to-end suites, and publish the binaries as release assets.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            arch: amd64
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false   # only used for `uv run --with python-pptx`; nothing to cache
      - run: sudo apt-get install -y -qq zstd
      # tree: trace + strip + verify inside Docker; binary: built in the rust:1.98-slim image
      # (glibc 2.36) and run in a bare debian:trixie-slim container without --lo-dir
      - run: PPTX_PDF_ARCH=${{ matrix.arch }} tools/lo-tree/build.sh
      - run: PPTX_PDF_ARCH=${{ matrix.arch }} tools/e2e-embedded.sh
      # slim binary: same source, tree hash pinned in, built in the same glibc-2.36 image
      - run: |
          sha=$(sha256sum tools/lo-tree/out/lo-tree-linux-${{ matrix.arch }}-portable.tar.zst | cut -d' ' -f1)
          echo "TREE_SHA=$sha" >> "$GITHUB_ENV"
          docker run --rm -v "$PWD":/src -w /src -e PPTX_PDF_LO_TREE_SHA256=$sha rust:1.98-slim \
            bash -c "cargo build -p pptx-pdf --release --locked --target-dir /src/target-linux-${{ matrix.arch }}-slim && chown -R $(id -u):$(id -g) /src/target-linux-${{ matrix.arch }}-slim"
      - uses: actions/upload-artifact@v7
        with:
          name: pptx-pdf-${{ matrix.target }}
          path: target-linux-${{ matrix.arch }}-embedded/release/pptx-pdf
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: pptx-pdf-slim-${{ matrix.target }}
          path: target-linux-${{ matrix.arch }}-slim/release/pptx-pdf
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: lo-tree-linux-${{ matrix.arch }}-portable
          path: tools/lo-tree/out/lo-tree-linux-${{ matrix.arch }}-portable.tar.zst
          if-no-files-found: error
      # Python wheel (slim: fetches the tree on first use), stable ABI, built in the manylinux
      # 2_28 container (the tree itself needs glibc 2.36 at run time)
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --manifest-path crates/pptx-pdf-py/Cargo.toml --out dist-py
          manylinux: "2_28"
        env:
          PPTX_PDF_LO_TREE_SHA256: ${{ env.TREE_SHA }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: dist-py/*.whl
          if-no-files-found: error

  macos:
    runs-on: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false   # only used for `uv run --with python-pptx`; nothing to cache
      # Pinned LibreOffice from TDF's permanent archive: the Homebrew cask on runners can lag
      # behind and point at a version the main download server has already removed.
      - name: LibreOffice ${{ env.LO_VERSION }}
        env:
          LO_VERSION: 26.8.0.3
        run: |
          curl -fsSL -o lo.dmg "https://downloadarchive.documentfoundation.org/libreoffice/old/$LO_VERSION/mac/aarch64/LibreOffice_${LO_VERSION}_MacOS_aarch64.dmg"
          hdiutil attach -nobrowse -quiet -mountpoint /tmp/lo lo.dmg
          cp -R /tmp/lo/LibreOffice.app /Applications/
          hdiutil detach -quiet /tmp/lo; rm lo.dmg
          /Applications/LibreOffice.app/Contents/MacOS/soffice --version
      - run: brew install zstd
      - run: cargo build -p pptx-pdf --release --locked
      - run: tools/lo-tree/macos/build.sh
      - run: tools/e2e-macos.sh
      - run: tools/e2e-slim.sh
      - run: |
          sha=$(shasum -a 256 tools/lo-tree/out/lo-tree-macos-arm64.tar.zst | cut -d' ' -f1)
          echo "TREE_SHA=$sha" >> "$GITHUB_ENV"
          PPTX_PDF_LO_TREE_SHA256=$sha cargo build -p pptx-pdf --release --locked --target-dir target-macos-slim
      - uses: actions/upload-artifact@v7
        with:
          name: pptx-pdf-aarch64-apple-darwin
          path: target-macos-embedded/release/pptx-pdf
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: pptx-pdf-slim-aarch64-apple-darwin
          path: target-macos-slim/release/pptx-pdf
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: lo-tree-macos-arm64
          path: tools/lo-tree/out/lo-tree-macos-arm64.tar.zst
          if-no-files-found: error
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --manifest-path crates/pptx-pdf-py/Cargo.toml --out dist-py
        env:
          PPTX_PDF_LO_TREE_SHA256: ${{ env.TREE_SHA }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-aarch64-apple-darwin
          path: dist-py/*.whl
          if-no-files-found: error

  release:
    # a workflow_dispatch from a branch builds and verifies everything but publishes nothing
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: package
        run: |
          set -eu
          tag=${GITHUB_REF_NAME}
          mkdir -p dist
          for target in aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu aarch64-apple-darwin; do
            for name in pptx-pdf pptx-pdf-slim; do
              stage=$(mktemp -d)
              cp "artifacts/$name-$target/pptx-pdf" "$stage/"; chmod +x "$stage/pptx-pdf"
              cp LICENSE README.md "$stage/"
              tar -czf "dist/$name-$tag-$target.tar.gz" -C "$stage" pptx-pdf LICENSE README.md
            done
          done
          for tree in linux-arm64-portable linux-amd64-portable macos-arm64; do
            cp "artifacts/lo-tree-$tree/lo-tree-$tree.tar.zst" "dist/lo-tree-$tree-$tag.tar.zst"
          done
          cp artifacts/wheel-*/*.whl dist/
          cp install.sh dist/
          (cd dist && sha256sum *.tar.gz *.tar.zst *.whl > SHA256SUMS && cat SHA256SUMS)
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # tools/release.sh may have created the release from locally verified binaries already;
          # in that case the CI-built, CI-verified assets replace them
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber dist/*.tar.gz dist/*.tar.zst dist/*.whl dist/SHA256SUMS dist/install.sh
          else
            gh release create "$GITHUB_REF_NAME" --title "pptx-pdf $GITHUB_REF_NAME" --generate-notes dist/*.tar.gz dist/*.tar.zst dist/*.whl dist/SHA256SUMS dist/install.sh
          fi
